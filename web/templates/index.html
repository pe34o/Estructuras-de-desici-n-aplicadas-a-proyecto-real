<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Estado de documentos</title>
</head>

<body>

    <h1>Estado de documentos médicos</h1>

    <form method="POST">

        <label>Perfil:</label>
        <input type="text" name="perfil" placeholder="medical" required>

        <br><br>

        <label>Cantidad de documentos:</label>
        <input type="number" name="documentos" required>

        <br><br>

        <button type="submit">Consultar estado</button>

    </form>

    {% if estado %}

        <h2>Resultado:</h2>

        <p>
            Estado: <strong>{{ estado }}</strong>
        </p>

    {% endif %}

</body>

</html>
